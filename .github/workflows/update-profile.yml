name: Update Profile Cards

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate live SVG cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_cards.py
      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet assets/featured-dark.svg assets/featured-light.svg assets/streak-dark.svg assets/streak-light.svg assets/footer-dark.svg assets/footer-light.svg; then
            git add assets/featured-dark.svg assets/featured-light.svg assets/streak-dark.svg assets/streak-light.svg assets/footer-dark.svg assets/footer-light.svg
            git commit -m "chore: sync live profile telemetry [skip ci]"
            git push
          fi

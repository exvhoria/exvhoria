<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 202" width="760" height="202" role="img" aria-label="GitHub Contribution Streak">
  <style>
    .st-aura { animation: stBreathe 3.4s ease-in-out infinite; }
    .st-flame { animation: stFlame 2.4s ease-in-out infinite; }
    @keyframes stBreathe { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
    @keyframes stFlame { 0%, 100% { opacity: 0.72; } 50% { opacity: 1; } }
  </style>
  <defs>
    <linearGradient id="st_bg_dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="50%" stop-color="#0d0d11"/>
      <stop offset="100%" stop-color="#111114"/>
    </linearGradient>
    <radialGradient id="centerAura_dark" cx="50%" cy="44%" r="44%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="45%" stop-color="#a1a1aa" stop-opacity="0.03"/>
      <stop offset="100%" stop-color="#09090b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ringAura_dark" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="65%" stop-color="#a1a1aa" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#09090b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="topSheen_dark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#27272a" stop-opacity="0"/>
      <stop offset="50%" stop-color="#e4e4e7" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#27272a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="divGrad_dark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#27272a" stop-opacity="0"/>
      <stop offset="50%" stop-color="#3f3f46" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#27272a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ringGrad_dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#e4e4e7"/>
      <stop offset="100%" stop-color="#a1a1aa"/>
    </linearGradient>
    <pattern id="st_dots_dark" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#27272a" opacity="0.28"/>
    </pattern>
    <filter id="softGlow_dark" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3.0" result="blur"/>
      <feFlood flood-color="#ffffff" flood-opacity="0.35" result="col"/>
      <feComposite in="col" in2="blur" operator="in" result="glow"/>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="758" height="200" rx="14" fill="url(#st_bg_dark)" stroke="#27272a" stroke-width="1"/>
  <rect x="1" y="1" width="758" height="200" rx="14" fill="url(#st_dots_dark)"/>
  <rect x="1" y="1" width="758" height="200" rx="14" fill="url(#centerAura_dark)"/>
  <line x1="140" y1="1.5" x2="620" y2="1.5" stroke="url(#topSheen_dark)" stroke-width="1.2"/>

  <line x1="253" y1="30" x2="253" y2="172" stroke="url(#divGrad_dark)" stroke-width="1"/>
  <line x1="507" y1="30" x2="507" y2="172" stroke="url(#divGrad_dark)" stroke-width="1"/>

  <text x="127" y="92" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="42" font-weight="700" fill="#ffffff" filter="url(#softGlow_dark)">75</text>
  <text x="127" y="128" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#d4d4d8">Total Contributions</text>
  <text x="127" y="151" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" fill="#71717a">Mar 6, 2024 – Present</text>

  <circle class="st-aura" cx="380" cy="80" r="46" fill="url(#ringAura_dark)"/>
  <circle cx="380" cy="80" r="34" fill="none" stroke="#27272a" stroke-width="3.5"/>
  <circle cx="380" cy="80" r="34" fill="none" stroke="url(#ringGrad_dark)" stroke-width="3.5" stroke-dasharray="178 36" stroke-dashoffset="-18" stroke-linecap="round" filter="url(#softGlow_dark)">
    <animateTransform attributeName="transform" type="rotate" from="0 380 80" to="360 380 80" dur="16s" repeatCount="indefinite"/>
  </circle>
  <circle cx="380" cy="46" r="9" fill="#0d0d11"/>
  <path class="st-flame" d="M380 35.5 C383.8 40.5 385.8 43.8 385.8 47 A5.8 5.8 0 0 1 374.2 47 C374.2 43.8 376.2 40.5 380 35.5 Z" fill="#ffffff" filter="url(#softGlow_dark)"/>
  <text x="380" y="92" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#ffffff" filter="url(#softGlow_dark)">0</text>
  <text x="380" y="138" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#fafafa">Current Streak</text>
  <text x="380" y="159" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" fill="#a1a1aa">No active streak</text>

  <text x="633" y="92" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="42" font-weight="700" fill="#ffffff" filter="url(#softGlow_dark)">4</text>
  <text x="633" y="128" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#d4d4d8">Longest Streak</text>
  <text x="633" y="151" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" fill="#71717a">Nov 15 – Nov 18</text>

  <text x="738" y="187" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" fill="#52525b">synced 2026-11-24 08:20 UTC</text>
</svg>

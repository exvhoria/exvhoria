<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 184" width="760" height="184" role="img" aria-label="Engineering Focus">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#111114"/>
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#27272a" opacity="0.35"/>
    </pattern>
  </defs>

  <rect x="1" y="1" width="758" height="182" rx="14" fill="url(#bg)" stroke="#27272a" stroke-width="1"/>
  <rect x="1" y="1" width="758" height="182" rx="14" fill="url(#dots)"/>

  <text x="28" y="36" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" letter-spacing="2" fill="#71717a">ENGINEERING FOCUS</text>
  <text x="732" y="36" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" fill="#52525b">ARCHITECTURE · SYSTEMS</text>

  <!-- Panel 1 -->
  <rect x="28" y="52" width="224" height="112" rx="10" fill="#111114" stroke="#27272a" stroke-width="1"/>
  <g transform="translate(46, 70)" stroke="#e4e4e7" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="2 4 6 8 2 12"/>
    <line x1="9" y1="12" x2="15" y2="12"/>
  </g>
  <text x="70" y="83" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="600" fill="#fafafa">Systems &amp; Tooling</text>
  <text x="46" y="114" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#a1a1aa">Resilient CLIs, daemons,</text>
  <text x="46" y="135" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#a1a1aa">and process supervisors.</text>

  <!-- Panel 2 -->
  <rect x="268" y="52" width="224" height="112" rx="10" fill="#111114" stroke="#27272a" stroke-width="1"/>
  <g transform="translate(286, 70)" stroke="#e4e4e7" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="2" width="12" height="5" rx="1.5"/>
    <rect x="2" y="9" width="12" height="5" rx="1.5"/>
  </g>
  <text x="310" y="83" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="600" fill="#fafafa">Backend &amp; Edge</text>
  <text x="286" y="114" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#a1a1aa">REST APIs, reverse proxies,</text>
  <text x="286" y="135" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#a1a1aa">and Cloudflare routing.</text>

  <!-- Panel 3 -->
  <rect x="508" y="52" width="224" height="112" rx="10" fill="#111114" stroke="#27272a" stroke-width="1"/>
  <g transform="translate(526, 70)" stroke="#e4e4e7" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="2" width="12" height="12" rx="2"/>
    <line x1="2" y1="7" x2="14" y2="7"/>
    <line x1="7" y1="7" x2="7" y2="14"/>
  </g>
  <text x="550" y="83" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="600" fill="#fafafa">Web Platforms</text>
  <text x="526" y="114" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#a1a1aa">Full-stack apps with</text>
  <text x="526" y="135" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" fill="#a1a1aa">Next.js, Node &amp; Flask.</text>
</svg>

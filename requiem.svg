<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 168" width="760" height="168" role="img" aria-label="ZyruMHD: Requiem">
  <defs>
    <linearGradient id="rq_bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#111114"/>
    </linearGradient>
    <radialGradient id="rq_glow" cx="88%" cy="45%" r="48%">
      <stop offset="0%" stop-color="#27272a" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#09090b" stop-opacity="0"/>
    </radialGradient>
    <pattern id="rq_dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#27272a" opacity="0.4"/>
    </pattern>
  </defs>

  <rect x="1" y="1" width="758" height="166" rx="14" fill="url(#rq_bg)" stroke="#27272a" stroke-width="1"/>
  <rect x="1" y="1" width="758" height="166" rx="14" fill="url(#rq_dots)"/>
  <rect x="1" y="1" width="758" height="166" rx="14" fill="url(#rq_glow)"/>

  <!-- Minimalist geometric crest -->
  <g transform="translate(672, 102)" fill="none">
    <polygon points="0,-38 38,0 0,38 -38,0" stroke="#27272a" stroke-width="1"/>
    <polygon points="0,-24 24,0 0,24 -24,0" stroke="#3f3f46" stroke-width="1" stroke-dasharray="3 3"/>
    <line x1="-44" y1="0" x2="44" y2="0" stroke="#27272a" stroke-width="0.9"/>
    <line x1="0" y1="-44" x2="0" y2="44" stroke="#27272a" stroke-width="0.9"/>
    <circle cx="0" cy="0" r="3.2" fill="#e4e4e7"/>
  </g>

  <!-- Eyebrow & Status -->
  <text x="28" y="36" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" letter-spacing="2" fill="#71717a">ZYRUMHD // ACTIVE INITIATIVE</text>

  <rect x="614" y="19" width="118" height="24" rx="12" fill="#18181b" stroke="#27272a" stroke-width="1"/>
  <circle cx="629" cy="31" r="3" fill="#e4e4e7"/>
  <text x="640" y="35" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" fill="#d4d4d8">IN PROGRESS</text>

  <!-- Project Title -->
  <text x="28" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="26" fill="#a1a1aa">ZyruMHD: <tspan fill="#fafafa" font-weight="700">Requiem</tspan></text>

  <!-- Description -->
  <text x="28" y="103" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" fill="#a1a1aa">Flagship project currently in active development under ZyruMHD.</text>

  <!-- Tags -->
  <rect x="28" y="122" width="80" height="26" rx="6" fill="#18181b" stroke="#27272a" stroke-width="1"/>
  <text x="68" y="139" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" fill="#d4d4d8">ZyruMHD</text>

  <rect x="116" y="122" width="108" height="26" rx="6" fill="#18181b" stroke="#27272a" stroke-width="1"/>
  <text x="170" y="139" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" fill="#d4d4d8">Active Build</text>

  <rect x="232" y="122" width="122" height="26" rx="6" fill="#18181b" stroke="#27272a" stroke-width="1"/>
  <text x="293" y="139" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" fill="#d4d4d8">In Development</text>
</svg>

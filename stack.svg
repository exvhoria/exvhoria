<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 352" width="760" height="352" role="img" aria-label="Engineering Focus and Technical Stack">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#111114"/>
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#27272a" opacity="0.35"/>
    </pattern>
  </defs>

  <rect x="1" y="1" width="758" height="350" rx="14" fill="url(#bg)" stroke="#27272a" stroke-width="1"/>
  <rect x="1" y="1" width="758" height="350" rx="14" fill="url(#dots)"/>

  <!-- Section 1: Focus -->
  <text x="28" y="34" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" letter-spacing="2" fill="#71717a">ENGINEERING FOCUS</text>
  <text x="732" y="34" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" fill="#52525b">ARCHITECTURE · SYSTEMS</text>

  <!-- Panel 1 -->
  <rect x="28" y="50" width="224" height="106" rx="10" fill="#111114" stroke="#27272a" stroke-width="1"/>
  <g transform="translate(46, 68)" stroke="#e4e4e7" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="2 4 6 8 2 12"/>
    <line x1="9" y1="12" x2="15" y2="12"/>
  </g>
  <text x="70" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#fafafa">Systems &amp; Tooling</text>
  <text x="46" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#a1a1aa">Resilient CLIs, daemons,</text>
  <text x="46" y="127" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#a1a1aa">and process supervisors.</text>

  <!-- Panel 2 -->
  <rect x="268" y="50" width="224" height="106" rx="10" fill="#111114" stroke="#27272a" stroke-width="1"/>
  <g transform="translate(286, 68)" stroke="#e4e4e7" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="2" width="12" height="5" rx="1.5"/>
    <rect x="2" y="9" width="12" height="5" rx="1.5"/>
  </g>
  <text x="310" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#fafafa">Backend &amp; Edge</text>
  <text x="286" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#a1a1aa">REST APIs, reverse proxies,</text>
  <text x="286" y="127" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#a1a1aa">and Cloudflare routing.</text>

  <!-- Panel 3 -->
  <rect x="508" y="50" width="224" height="106" rx="10" fill="#111114" stroke="#27272a" stroke-width="1"/>
  <g transform="translate(526, 68)" stroke="#e4e4e7" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="2" width="12" height="12" rx="2"/>
    <line x1="2" y1="7" x2="14" y2="7"/>
    <line x1="7" y1="7" x2="7" y2="14"/>
  </g>
  <text x="550" y="80" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="600" fill="#fafafa">Web Platforms</text>
  <text x="526" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#a1a1aa">Full-stack applications with</text>
  <text x="526" y="127" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" fill="#a1a1aa">Next.js, Node.js, and Flask.</text>

  <!-- Divider -->
  <line x1="28" y1="178" x2="732" y2="178" stroke="#27272a" stroke-width="1"/>

  <!-- Section 2: Technical Stack -->
  <text x="28" y="206" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" letter-spacing="2" fill="#71717a">TECHNICAL STACK</text>

  <!-- Row 1: Languages -->
  <text x="28" y="241" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" fill="#71717a">LANGUAGES</text>

  <rect x="140" y="223" width="96" height="26" rx="6" fill="#18181b" stroke="#27272a" stroke-width="1"/>
  <text x="188" y="240" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" fill="#e4e4e7">TypeScript</text>

  <rect x="244" y="223" width="96" height="26" rx="6" fill="#18181b" stroke="#27272a" stroke-width="1"/>
  <text x="292" y="240" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" fill="#e4e4e7">JavaScript</text>

  <rect x="348" y="223" width="74" height="26" rx="6" fill="#18181b" stroke="#27272a" stroke-width="1"/>
  <text x="385" y="240" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" fill="#e4e4e7">Python</text>

  <rect x="430" y="223" width="54" height="26" rx="6" fill="#18181b" stroke="#27272a" stroke-width="1"/>
  <text x="457" y="240" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" fill="#e4e4e7">Lua</text>

  <!-- Row 2: Frameworks -->
  <text x="28" y="279" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" fill="#71717a">FRAMEWORKS</text>

  <rect x="140" y="261" width="74" height="26" rx="6" fill="#18181b" stroke="#27272a" stroke-width="1"/>
  <text x="177" y="278" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" fill="#e4e4e7">Next.js</text>

  <rect x="222" y="261" width="78" height="26" rx="6" fill="#18181b" stroke="#27272a" stroke-width="1"/>
  <text x="261" y="278" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" fill="#e4e4e7">Node.js</text>

  <rect x="308" y="261" width="64" height="26" rx="6" fill="#18181b" stroke="#27272a" stroke-width="1"/>
  <text x="340" y="278" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" fill="#e4e4e7">Flask</text>

  <rect x="380" y="261" width="110" height="26" rx="6" fill="#18181b" stroke="#27272a" stroke-width="1"/>
  <text x="435" y="278" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" fill="#e4e4e7">Tailwind CSS</text>

  <rect x="498" y="261" width="84" height="26" rx="6" fill="#18181b" stroke="#27272a" stroke-width="1"/>
  <text x="540" y="278" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" fill="#e4e4e7">Electron</text>

  <!-- Row 3: Infra & Data -->
  <text x="28" y="317" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" fill="#71717a">INFRA &amp; DATA</text>

  <rect x="140" y="299" width="96" height="26" rx="6" fill="#18181b" stroke="#27272a" stroke-width="1"/>
  <text x="188" y="316" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" fill="#e4e4e7">Cloudflare</text>

  <rect x="244" y="299" width="74" height="26" rx="6" fill="#18181b" stroke="#27272a" stroke-width="1"/>
  <text x="281" y="316" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" fill="#e4e4e7">Docker</text>

  <rect x="326" y="299" width="72" height="26" rx="6" fill="#18181b" stroke="#27272a" stroke-width="1"/>
  <text x="362" y="316" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" fill="#e4e4e7">Vercel</text>

  <rect x="406" y="299" width="88" height="26" rx="6" fill="#18181b" stroke="#27272a" stroke-width="1"/>
  <text x="450" y="316" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" fill="#e4e4e7">MongoDB</text>

  <rect x="502" y="299" width="72" height="26" rx="6" fill="#18181b" stroke="#27272a" stroke-width="1"/>
  <text x="538" y="316" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" fill="#e4e4e7">SQLite</text>
</svg>

  <text x="62" y="54" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" letter-spacing="2.2" fill="#71717a">EXVHORIA // PROFILE</text>

  <!-- Name -->
  <text x="44" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="44" font-weight="700" letter-spacing="-1.2" fill="#fafafa">GhosttedXV</text>

  <!-- Subtitle -->
  <text x="44" y="140" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#a1a1aa">Software &amp; Systems Engineering  ·  ZyruMHD</text>


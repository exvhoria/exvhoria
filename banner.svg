<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 210" width="760" height="210" role="img" aria-label="GhosttedXV — Software &amp; Systems Engineering">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#111114"/>
    </linearGradient>
    <radialGradient id="glow" cx="85%" cy="25%" r="55%">
      <stop offset="0%" stop-color="#27272a" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#09090b" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#27272a" opacity="0.55"/>
    </pattern>
  </defs>

  <rect x="1" y="1" width="758" height="208" rx="14" fill="url(#bg)" stroke="#27272a" stroke-width="1"/>
  <rect x="1" y="1" width="758" height="208" rx="14" fill="url(#dots)"/>
  <rect x="1" y="1" width="758" height="208" rx="14" fill="url(#glow)"/>

  <!-- Minimalist geometric mark -->
  <g transform="translate(610, 105)" fill="none">
    <circle cx="0" cy="0" r="56" stroke="#27272a" stroke-width="1"/>
    <circle cx="0" cy="0" r="38" stroke="#3f3f46" stroke-width="1" stroke-dasharray="4 4"/>
    <line x1="-68" y1="0" x2="68" y2="0" stroke="#27272a" stroke-width="1"/>
    <line x1="0" y1="-68" x2="0" y2="68" stroke="#27272a" stroke-width="1"/>
    <circle cx="0" cy="0" r="4" fill="#e4e4e7"/>
    <circle cx="38" cy="0" r="2.5" fill="#71717a"/>
    <circle cx="-27" cy="-27" r="2.5" fill="#71717a"/>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 96" width="760" height="96" role="img" aria-label="Minigame: Alya Kujou Patting Simulator">
  <defs>
    <linearGradient id="mg_bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="100%" stop-color="#111114"/>
    </linearGradient>
    <radialGradient id="mg_glow" cx="92%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#27272a" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#09090b" stop-opacity="0"/>
    </radialGradient>
    <pattern id="mg_dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#27272a" opacity="0.35"/>
    </pattern>
  </defs>

  <rect x="1" y="1" width="758" height="94" rx="14" fill="url(#mg_bg)" stroke="#27272a" stroke-width="1"/>
  <rect x="1" y="1" width="758" height="94" rx="14" fill="url(#mg_dots)"/>
  <rect x="1" y="1" width="758" height="94" rx="14" fill="url(#mg_glow)"/>

  <!-- Icon Box -->
  <rect x="24" y="24" width="48" height="48" rx="10" fill="#18181b" stroke="#27272a" stroke-width="1"/>
  <g transform="translate(36, 36)" fill="none" stroke="#e4e4e7" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2" y="6" width="20" height="12" rx="4"/>
    <line x1="6" y1="12" x2="10" y2="12"/>
    <line x1="8" y1="10" x2="8" y2="14"/>
    <circle cx="15.5" cy="10.8" r="0.8" fill="#e4e4e7" stroke="none"/>
    <circle cx="18" cy="13.2" r="0.8" fill="#e4e4e7" stroke="none"/>
  </g>

  <!-- Labels -->
  <text x="88" y="36" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" letter-spacing="1.8" fill="#71717a">MINIGAME // SIDE QUEST</text>
  <text x="88" y="59" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17.5" font-weight="600" fill="#fafafa">Alya Kujou Patting Simulator</text>
  <text x="88" y="78" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" fill="#71717a">reanimepatting.pages.dev</text>

  <!-- Play Pill -->
  <rect x="616" y="34" width="116" height="28" rx="8" fill="#18181b" stroke="#27272a" stroke-width="1"/>
  <text x="674" y="52" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" fill="#e4e4e7">PLAY NOW &#8599;</text>
</svg>
